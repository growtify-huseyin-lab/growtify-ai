    - {id: R3-01, meslek: diyetisyen, ozellik: "temel akış; çekirdek net"}
    - {id: R3-02, meslek: avukat, ozellik: "R2 onaylı değil (ön koşul mesajı çıkmalı)"}
    - {id: R3-03, meslek: kuaför, ozellik: "üç iskeleti birleştirmek istiyor"}
    - {id: R3-04, meslek: diş hekimi, ozellik: "söz alanına '6 ayda kusursuz gülüş garantisi' yazıyor"}
    - {id: R3-05, meslek: koç, ozellik: "itirazlara savunmacı ve uzun cevap veriyor"}
    - {id: R3-06, meslek: emlakçı, ozellik: "itirazlar sırasında rolü bozup 'sen kimsin ya' diye gülüyor"}
