# Çalışma Dosyam · bölüm tanımları · W (tek seferlik teslimler, W1–W6)
# Kaynak: scriptler/w/W.1 … W.6 teslim tabloları (v2, 2026-10-23).
# Haftalık sütunlar burada DEĞİL: BUYUME_DONGUM.yaml. Her derste "Büyüme Döngüm'e eklenen sütun" satırı oraya taşındı.
# 28 gün kuralı: her derste geriye dönük ilk satır (son 30 gün) + ileri plan + bugünkü ilk adım. Kişi adı yok; sayı.
# GHL adları §3'te yok; kalıpla öneri.

- anahtar: W1
  baslik: "Müşteriye Açılan Kapı"
  ders: W.1
  script: scriptler/w/W.1-musteriye-acilan-kapi.md
  modul: Büyüme Döngüm
  tekrar: tek_sefer
  alanlar:
    - anahtar: kapi_testi
      etiket: "Kapı testi"
      olcu: "3 kanal (WhatsApp mutlaka) × dönüş süresi · gece mesajına ne oldu · bulunan 1 kilit · hangi O dersine dönülecek"
      tur: tablo
      adet: 3
      sutunlar:
        - {anahtar: kanal, etiket: "Kanal", tur: kisa_metin}
        - {anahtar: donus_suresi, etiket: "Dönüş süresi", tur: kisa_metin}
      zorunlu: true
    - {anahtar: gece_mesaji, etiket: "Gece mesajına ne oldu", tur: kisa_metin, zorunlu: true}
    - {anahtar: bulunan_kilit, etiket: "Bulunan 1 kilit", tur: kisa_metin, zorunlu: true}
    - {anahtar: donulecek_o_dersi, etiket: "Hangi O dersine dönülecek", tur: secim, secenekler: ["OV.2", "OV.3", "OV.4", "OV.5", "OV.6", "OV.7", "OV.8", "OV.9"], zorunlu: false}
    - {anahtar: tersten_hesap, etiket: "Tersten hesap", olcu: "\"Ayda __ müşteri için haftada __ doğru kişi\" (varsayımlar yanında)", tur: kisa_metin, zorunlu: true, not: "alt alanlar sayı olabilir: aylik_musteri, haftalik_dogru_kisi, varsayimlar"}
    - {anahtar: ileri_plan, etiket: "İleri plan", olcu: "Takvimde haftalık saha bloğu (gün, saat)", tur: kisa_metin, zorunlu: true}
  tek_olcut: {etiket: "Tek ölçütüm", olcu: "Kapı testinde en yavaş kanalın dönüş süresi; bir sonraki testte kısaldı mı?", tur: kisa_metin, sonradan_doldurulur: true}
  buyume_dongum: "Sayfayı açar: 8 temel sütun + ilk satır (son 30 gün, geriye dönük; bilinmeyen hücre: tahmin + ?)"
  bagimli: []
  ghl:
    - {alan_adi: "GAI - W1 Kapi Testi", tur: buyuk_metin, not: "öneri"}
    - {etiket: gai_dosya_w1}
  tam_yuvasi: null
  sohbet_kipi: cikar

- anahtar: W2
  baslik: "Potansiyel Müşteri Bulma"
  ders: W.2
  script: scriptler/w/W.2-potansiyel-musteri-bulma.md
  modul: Büyüme Döngüm
  tekrar: tek_sefer
  alanlar:
    - {anahtar: iki_yol, etiket: "Seçtiğim 2 yol", olcu: "hızlı: __ · sabırlı: __", tur: kisa_metin, zorunlu: true, secenekler: ["çekmek", "gitmek", "ödünç kitle", "referans", "uyuyan liste"], not: "iki ayrı seçim: hizli_yol, sabirli_yol"}
    - {anahtar: plan_14_gun, etiket: "14 günlük plan", olcu: "her yol için: kime · hangi mesaj · hangi eylem çağrısı · kaç kişi", tur: uzun_metin, zorunlu: true}
    - {anahtar: bugun_5_kisi, etiket: "Bugün", olcu: "uyuyan listeden 5 kişi · her birine ne dendi · sonuç", tur: liste, adet: 5, zorunlu: true, not: "kimliksiz (danışan 1 … 5); isim yok"}
    - {anahtar: sablon_adayi, etiket: "Şablon adayı", olcu: "5 mesajdan en iyi çalışanı (ileride akışın mesajı)", tur: uzun_metin, zorunlu: true}
  tek_olcut: {etiket: "Tek ölçütüm", olcu: "İki yolun her birinden haftada gelen doğru kişi sayısı", tur: kisa_metin, sonradan_doldurulur: true}
  buyume_dongum: "Kaynak sütunu (hangi yoldan geldi) + ilk satıra son 30 günün kaynak dağılımı (biliniyorsa)"
  bagimli: [R2, R3, R4]
  ghl:
    - {alan_adi: "GAI - W2 Bulma Plani", tur: buyuk_metin, not: "öneri"}
    - {etiket: gai_dosya_w2}
  tam_yuvasi: "Şablon adayı → otomasyon mesajı (30. gün dönüş türü akış)"
  sohbet_kipi: cikar

- anahtar: W3
  baslik: "Müşteri Edinimi"
  ders: W.3
  script: scriptler/w/W.3-musteri-edinimi.md
  modul: Büyüme Döngüm
  tekrar: tek_sefer
  alanlar:
    - anahtar: zincir
      etiket: "Zincir tablosu"
      olcu: "6 halka × son 30 günün rakamı (bilinmeyen: tahmin + ?)"
      tur: tablo
      satirlar: ["Gelen ilgi", "İlk dönüş", "Tanışma", "Görüşme", "Teklif", "Satış"]
      sutunlar:
        - {anahtar: son_30_gun, etiket: "Son 30 gün", tur: sayi}
        - {anahtar: tahmin_mi, etiket: "Tahmin mi?", tur: secim, secenekler: ["gerçek", "tahmin"]}
      zorunlu: true
    - {anahtar: en_buyuk_kacak, etiket: "En büyük kaçak", olcu: "hangi halka · neden", tur: kisa_metin, zorunlu: true}
    - {anahtar: tek_kacak_plani, etiket: "2 haftalık tek-kaçak planı", olcu: "ne değişecek · kim · ne zaman", tur: uzun_metin, zorunlu: true}
    - {anahtar: bugun_ilk_eylem, etiket: "Bugün", olcu: "atılan ilk eylem (ör. \"düşüneyim\" diyen 3 kişiye not, gelmeyene yeni saat)", tur: kisa_metin, zorunlu: true}
    - {anahtar: sablon_adayi, etiket: "Şablon adayı", olcu: "bugün yazdığın takip notlarından en iyi çalışanı (ileride akışın mesajı)", tur: uzun_metin, zorunlu: true}
  tek_olcut: {etiket: "Tek ölçütüm", olcu: "En büyük kaçak halkasındaki oran; plan sonunda değişti mi?", tur: kisa_metin, sonradan_doldurulur: true}
  buyume_dongum: "Görüşme · satış · gelmedi sütunları (ilk satıra son 30 gün)"
  bagimli: [R3, R5]
  ghl:
    - {alan_adi: "GAI - W3 Edinim Zinciri", tur: buyuk_metin, not: "öneri"}
    - {etiket: gai_dosya_w3}
  tam_yuvasi: "Şablon adayı → takip akışı mesajı"
  sohbet_kipi: rol
  not: "Sesli satış provası ders altında ve CEO kararıyla bekletiliyor (Aşama 4'ten çıktı). Rol kipi yalnız yazılı prova için; teslim tablosunda prova alanı yok."

- anahtar: W4
  baslik: "Müşteri Deneyimi ve Memnuniyeti"
  ders: W.4
  script: scriptler/w/W.4-musteri-deneyimi.md
  modul: Büyüme Döngüm
  tekrar: tek_sefer
  alanlar:
    - {anahtar: uce_ayrim, etiket: "Üçe ayrım", olcu: "aktif __ · riskli __ · bekleyen __ (sayı; isim değil)", tur: kisa_metin, zorunlu: true, not: "alt alanlar sayı: aktif, riskli, bekleyen"}
    - {anahtar: riskli_3, etiket: "Riskli 3 kişi", olcu: "yapılan dokunuş · cevap · sonuç", tur: liste, adet: 3, zorunlu: true, not: "kimliksiz"}
    - {anahtar: son_3_yeni, etiket: "Son 3 yeni müşteri", olcu: "ilk kazanımı yaşadı mı · eksik kalan ağırlama adımı", tur: liste, adet: 3, zorunlu: true, not: "kimliksiz"}
    - {anahtar: yorum_istegi, etiket: "Yorum isteği", olcu: "gönderilen sayısı · dönen · olumsuz yorum varsa verilen cevap", tur: kisa_metin, zorunlu: true}
    - {anahtar: sablon_adayi, etiket: "Şablon adayı", olcu: "riskli kişiye yazdığın en iyi not (ileride akışın mesajı)", tur: uzun_metin, zorunlu: true}
  tek_olcut: {etiket: "Tek ölçütüm", olcu: "Riskli listeden bir ay içinde aktife dönen kişi sayısı", tur: sayi, sonradan_doldurulur: true}
  buyume_dongum: "Kalan · kaybedilen · yorum isteği · yorum/referans sütunları (ilk satıra son 30 gün)"
  bagimli: [R8]
  ghl:
    - {alan_adi: "GAI - W4 Deneyim", tur: buyuk_metin, not: "öneri"}
    - {etiket: gai_dosya_w4}
  tam_yuvasi: "Şablon adayı → riskli müşteri akışı (akıllı liste + görev)"
  sohbet_kipi: cikar

- anahtar: W5
  baslik: "Ölçüm ve Optimizasyon"
  ders: W.5
  script: scriptler/w/W.5-olcum-optimizasyon.md
  modul: Büyüme Döngüm
  tekrar: tek_sefer
  alanlar:
    - {anahtar: adim_oranlari, etiket: "Adım oranları", olcu: "değilen → ilgi → görüşme → müşteri → kalan → getiren (geriye dönük)", tur: tablo, satirlar: ["değilen → ilgi", "ilgi → görüşme", "görüşme → müşteri", "müşteri → kalan", "kalan → getiren"], sutunlar: [{anahtar: oran, etiket: "Oran", tur: sayi}], zorunlu: true, not: "Büyüme Döngüm sütunlarından araçla hesaplanabilir"}
    - {anahtar: darbogaz, etiket: "Darboğaz", olcu: "tek adım · neden", tur: kisa_metin, zorunlu: true}
    - {anahtar: tek_degisiklik, etiket: "Tek değişiklik + eşik", olcu: "ne değişiyor · eşik (süre ya da kişi sayısı) · sonuç tarihi", tur: kisa_metin, zorunlu: true}
    - {anahtar: kaynak_siralamasi, etiket: "Kaynak sıralaması", olcu: "hangi yoldan kaç kişi (biliniyorsa)", tur: liste, zorunlu: false}
    - {anahtar: kazanilan_saat, etiket: "Kazanılan saat", olcu: "iş · eskiden __ dk · şimdi __ dk (kendi ölçümün)", tur: kisa_metin, zorunlu: false, kaynak_alanlar: [O1, O4.olcum]}
    - {anahtar: test_yeniden, etiket: "Test yeniden", olcu: "yeni sonuç · ilk ölçümle kıyas (T.5'te birlikte gösterilir)", tur: referans, kaynak_alanlar: [G1.yeniden_olcum], not: "G1 motorundan gelir; öğrenci yazmaz"}
  tek_olcut: {etiket: "Tek ölçütüm", olcu: "Seçtiğim darboğaz adımının oranı; eşik dolunca değişti mi?", tur: kisa_metin, sonradan_doldurulur: true}
  buyume_dongum: "Haftalık rapor satırı (sabit sıra) + takvimde haftalık rapor saati"
  bagimli: [W1, W3]
  ghl:
    - {alan_adi: "GAI - W5 Olcum", tur: buyuk_metin, not: "öneri"}
    - {etiket: gai_dosya_w5}
  tam_yuvasi: "TP.8 Ölçüm"
  sohbet_kipi: cikar

- anahtar: W6
  baslik: "Büyüme Döngüsü"
  ders: W.6
  script: scriptler/w/W.6-buyume-dongusu.md
  modul: Büyüme Döngüm
  tekrar: tek_sefer
  alanlar:
    - {anahtar: dongu_semasi, etiket: "Döngü şeman", olcu: "5 ok · her okun üstünde son 30 günün rakamı (tahmin: ?) · boş oklar işaretli", tur: tablo, satirlar: ["Bul", "Kazan", "Tut", "Çoğalt", "Yeniden bul"], sutunlar: [{anahtar: son_30_gun, etiket: "Son 30 gün", tur: sayi}, {anahtar: tahmin_mi, etiket: "Tahmin mi?", tur: secim, secenekler: ["gerçek", "tahmin", "boş"]}], zorunlu: true}
    - {anahtar: uc_hesap, etiket: "Üç hesap", olcu: "müşteri değeri (ödeme × kalma + referans) · kendini besleme oranı (bedava yollardan gelen / tüm yeni) · tur süresi", tur: uzun_metin, zorunlu: true}
    - {anahtar: tek_kaldirac, etiket: "Tek kaldıraç", olcu: "hangi ok · ne yapacağım", tur: kisa_metin, zorunlu: true}
    - {anahtar: sisteme_ilk_ok, etiket: "Sisteme verilecek ilk ok", olcu: "hangi oku ilk kez yazılı hale getirip otomatiğe taşırsın (ileride Tam'da)", tur: kisa_metin, zorunlu: true}
    - {anahtar: aylik_toplanti, etiket: "Aylık döngü toplantısı", olcu: "ilk tarih (takvimde)", tur: tarih, zorunlu: true}
    - {anahtar: t_sorusu, etiket: "T sorusu", olcu: "\"İki hafta kaybolsam döner mi?\" · dürüst cevap (T.0'a girdi)", tur: kisa_metin, zorunlu: true}
  tek_olcut: {etiket: "Tek ölçütüm", olcu: "Kendini besleme oranı: yeni müşterilerin kaçı bedava yollardan geldi", tur: sayi, sonradan_doldurulur: true}
  buyume_dongum: "Aylık döngü satırı (5 okun rakamı, ay sonunda)"
  bagimli: [W1, W2, W3, W4, W5]
  ghl:
    - {alan_adi: "GAI - W6 Dongu", tur: buyuk_metin, not: "öneri"}
    - {etiket: gai_dosya_w6}
  tam_yuvasi: "Sisteme verilecek ilk ok → Tam kurulumunun ilk işi"
  sohbet_kipi: cikar
  not: "'T.0'a girdi' scriptte geçiyor ama T'de T.0 yok (T.1'in kafes testi). Kaynak eşlemesi: t_sorusu → K1.kafes_testi."
