# Çalışma Dosyam · bölüm tanımları · OV (Kurulum Haritam, 9 satır)
# Kaynak: scriptler/o-vitrin/OV.0, OV.2 … OV.9 teslim tabloları (2026-10-23). OV.1 yok.
# GHL (Course kararı 2026-10-23, MIMARI §3): satır başına bir uzun metin alanı "GAI - Harita OVn"; içerik etiketli satırlar ("Yuva: …");
# tümü dolunca etiket gai_harita_tamam. Tam'ı besleyen kısa değerler için yeni alan açılmaz, R alanlarına referans verilir.
# Ortak kural: Temel'de hesap yok; bu satırlar plan, kurulum değil. Alanlar "buraya ne koyacağım" sorusunu cevaplar.

- anahtar: OV0
  baslik: "Kurulum Haritam açılır"
  ders: OV.0
  script: scriptler/o-vitrin/OV.0-vitrin-girisi.md
  modul: Kurulum Haritam
  tekrar: tek_sefer
  alanlar:
    - {anahtar: isim_adi, soru: "İşinin adı ne?", aciklama: "Müşterilerinin seni bildiği adı yaz; şirket adın farklıysa ikisini de ekleyebilirsin.", ornek: "(işinin adı)", etiket: "İşimin adı", tur: kisa_metin, zorunlu: true}
    - {anahtar: dagilim_3_yer, soru: "Müşterilerinin bilgileri bugün hangi üç yerde dağınık duruyor?", aciklama: "Mesajların, randevuların ve notların bugün nerede tutulduğunu üç madde olarak yaz.", ornek: "WhatsApp · randevu defteri · telefondaki notlar", etiket: "Müşterilerim bugün hangi 3 yerde dağılmış", olcu: "ör. WhatsApp · defter · tablo", tur: liste, adet: 3, zorunlu: true}
  tek_olcut: null
  bagimli: []
  ghl: [{alan_adi: "GAI - Harita OV0", tur: buyuk_metin}]
  tam_yuvasi: "Tam ilk görüşmesinin gündemi (OV.9 harita özeti)"
  sohbet_kipi: yok
  not: "Scriptte tek ölçüt yok. 'Sonraki satırlar her OV dersinde eklenir' yalnız açıklama."

- anahtar: OV2
  baslik: "Yuva Haritam"
  ders: OV.2
  script: scriptler/o-vitrin/OV.2-kimsin.md
  modul: Kurulum Haritam
  satir: Kimsin
  tekrar: tek_sefer
  alanlar:
    - {anahtar: isletme_profili, soru: "İşletme profiline hangi temel bilgiler girecek?", aciklama: "Adını, iletişim bilgilerini, varsa adresini ve logonun olup olmadığını yaz.", ornek: "(işinin adı) · e-posta ve telefon · çevrim içi çalışıyorum · logo var", etiket: "İşletme Profili", olcu: "Ad, iletişim, adres (varsa), logo", tur: kisa_metin, zorunlu: true}
    - {anahtar: tasarim_kiti, soru: "Markanın görünüşü nasıl: logo, renkler ve yazı tipi neler?", aciklama: "Logonu, iki üç rengini ve kullandığın yazı tipini yaz; henüz yoksa \"henüz yok\" demen yeter.", ornek: "Yeşil yaprak logolu · açık yeşil ve krem · sade, yuvarlak bir yazı tipi", etiket: "Marka Panoları › Tasarım Kiti", olcu: "Logo, 2–3 renk, yazı tipi (yoksa \"henüz yok\")", tur: kisa_metin, zorunlu: true}
    - {anahtar: ozel_degerler, soru: "Her yerde aynı görünmesi gereken kısa metinlerin neler?", aciklama: "Tek cümleni ve kime hizmet ettiğini Kimlik Çekirdeğinden al, yanına üç dört cümlelik kısa bir tanıtım ekle.", ornek: "Kısa tanıtım: Kırkından sonra bedenini yeniden tanımak isteyen kadınlarla çalışıyorum. Yasak listesiyle değil, kendi sofrandan başlıyoruz.", etiket: "Özel Değerler", olcu: "Tek cümle (≤20 kelime) · kime (1 satır) · kısa tanıtım (3–4 cümle)", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R2.tek_cumle, R2.kime_kime_degil], not: "tek cümle ve kime R2'den referans; yalnız kısa tanıtım yeni"}
    - {anahtar: marka_sesi, soru: "Yapay zekâ senin adına yazarken nasıl konuşmalı?", aciklama: "Ses notunun beş maddesini, duruşunu ve hiç kullanmadığın kelimeleri yaz.", ornek: "Sıcak ve sade, kısa cümleler, 'sen' diye hitap · mucize diyetlere karşıyım · 'yasak' ve 'garanti' kelimelerini kullanmam", etiket: "Marka Panoları › Marka Sesi", olcu: "Ses notu (5 madde) + duruş (1–2 cümle) + kaçındığım kelimeler", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R2.ses, R2.durus]}
    - {anahtar: bilgi_bankasi, soru: "Seni soran birine asistanın neleri bilerek cevap vermeli?", aciklama: "Kimlik Çekirdeğin ve beyin dosyandaki en sık sorulan beş soru ile cevapları buraya kendiliğinden gelir; burada yalnız eksik ya da değişecek bir şey varsa not et.", ornek: "Soru: Görüşmeler çevrim içi mi? Cevap: Evet, haftada bir çevrim içi görüşüyoruz.", etiket: "Bilgi Bankası", olcu: "Neden · kime / kime değil · dönüşüm (önce → sonra) · nasıl · duruş · en sık sorulan 5 soru ve cevabı", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R2, O2.sik_sorulanlar], referans: true}
    - {anahtar: disarida_elle, soru: "Sosyal medya biyografilerin ve işletme açıklamaların ne diyecek?", aciklama: "Instagram ya da LinkedIn biyografini, Google İşletme açıklamanı ve WhatsApp Business açıklamanı aynı çekirdekten kısaca yaz.", ornek: "Instagram: Kırkından sonra yasaksız ve adım adım beslenme. Randevu için mesaj at.", etiket: "Dışarıda, elle", olcu: "Instagram / LinkedIn biyografisi · Google İşletme açıklaması · WhatsApp Business açıklaması", tur: uzun_metin, zorunlu: false}
  tek_olcut: null
  bagimli: [R2]
  ghl: [{alan_adi: "GAI - Harita OV2", tur: buyuk_metin}]
  tam_yuvasi: "TP.1: İşletme Profili, Tasarım Kiti, Özel Değerler, Marka Sesi, Bilgi Bankası"
  sohbet_kipi: cikar
  not: "İsteğe bağlı 'yüz denetimi' ders altında; alan değil. Scriptte tek ölçüt yok. Course kararı 2026-10-24: Bilgi Bankası'ndaki 5 soru R4'teki 10 sorudan seçilir; cevaplar O2 beyin dosyasında yazılır, burada referans olarak gösterilir (iki kez yazdırılmaz)."

- anahtar: OV3
  baslik: "Teklif Yerleşimim"
  ders: OV.3
  script: scriptler/o-vitrin/OV.3-teklif.md
  modul: Kurulum Haritam
  satir: Teklif
  tekrar: tek_sefer
  alanlar:
    - {anahtar: teklif, soru: "Teklifinin adı, tek cümlelik sözü ve içinde neler olacak?", aciklama: "Teklifin adını, müşteriye verdiğin sözü tek cümleyle ve dahil olanları liste olarak yaz; garanti verme.", ornek: "Kendi Sofran Programı · Bu yolu seninle haftalık adımlarla yürüyeceğim · haftalık görüşme, mesajla destek, kişisel plan", etiket: "Teklif", olcu: "Ad · tek cümlelik söz (açıklama) · neler dahil (liste)", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R3.soz]}
    - {anahtar: urun, soru: "Müşterinin ödeyeceği kalemin adı ne ve hangi biçimde satılacak?", aciklama: "Ödeme kaleminin adını ve tek seferlik mi, üyelik mi, seans mı olduğunu yaz; fiyatı Fiyat ve Ödeme dersinde koyacağız.", ornek: "Kendi Sofran Programı · tek seferlik paket", etiket: "Ürün", olcu: "Ödeme kaleminin adı · biçim (tek seferlik / üyelik / seans) · fiyat: R.7'de", tur: kisa_metin, zorunlu: true}
    - {anahtar: sayfa, soru: "Satış sayfanın bölümleri neler olacak?", aciklama: "Teklif dersindeki dokuz başlığı sayfanın bölümleri olarak sırala; gerçek kanıtın yoksa kanıt bölümünü koyma, beş itirazı sık sorulanlara yaz.", ornek: "Başlık ve söz · kimin için · önce ve sonra · yolum · neler dahil · ben kimim · sık sorulanlar · ilk adım", etiket: "Sayfa", olcu: "9 başlık → 9 bölüm · kanıt yoksa bölüm yok · 5 itiraz → sık sorulanlar", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R3.sayfa_iskeleti, R3.itirazlar]}
    - {anahtar: bilgi_bankasi, soru: "Asistanın teklifinle ilgili hangi soruları cevaplayabilmeli?", aciklama: "Teklif dersindeki beş itirazı ve cevaplarını aynen buraya taşı.", ornek: "Zamanım yok → Görüşmeler kısa; düzen senin günlük hayatına göre kurulur.", etiket: "Bilgi Bankası", olcu: "Aynı 5 soru-cevap", tur: kisa_metin, zorunlu: true, kaynak_alanlar: [R3.itirazlar]}
    - {anahtar: sartlar, soru: "Teklifinin şartları ne olacak?", aciklama: "Sözünün sınırını bir iki cümleyle yaz, internetten satıyorsan ön bilgilendirme ve mesafeli satış metni gerekip gerekmediğini, birebir uzun hizmette imzalı sözleşme isteyip istemediğini not et.", ornek: "Sonuç değil süreç sözü veriyorum · internetten satış için mesafeli satış metni gerekiyor · imzalı sözleşme istemiyorum", etiket: "Şartlar", olcu: "Söz sınırı (1–2 cümle) · ön bilgilendirme + mesafeli satış gerekli mi · imzalı sözleşme gerekli mi (birebir/uzun hizmet)", tur: uzun_metin, zorunlu: true}
  tek_olcut: {soru: "Satış sayfanın ilk ekranını gösterdiğin üç kişiden kaçı 'bu kimin için ve ne veriyor' sorusunu doğru cevapladı?", aciklama: "İlk ekranı seni tanımayan üç kişiye göster; doğru cevaplayanların sayısını yaz.", etiket: "Tek ölçüt", olcu: "Sayfanın ilk ekranını gösterdiğin üç kişiden kaçı \"bu kimin için ve ne veriyor\" sorusunu doğru cevapladı? (R.3 ile aynı ölçüt, bu kez sayfada.)", tur: sayi, sonradan_doldurulur: true}
  bagimli: [R3]
  ghl: [{alan_adi: "GAI - Harita OV3", tur: buyuk_metin}]
  tam_yuvasi: "TP.2: Teklifler, Ürünler, satış hunisi sayfası, Belgeler ve Sözleşmeler, Bilgi Bankası"
  sohbet_kipi: cikar

- anahtar: OV4
  baslik: "Ekosistem Yerleşimim"
  ders: OV.4
  script: scriptler/o-vitrin/OV.4-ekosistem.md
  modul: Kurulum Haritam
  satir: Ekosistem
  tekrar: tek_sefer
  alanlar:
    - {anahtar: sosyal_planlayici, soru: "Hangi kanallarda, haftada kaç kez paylaşım yapacaksın?", aciklama: "Ana kanalını ya da kanallarını, kısaltarak paylaşacağın türev kanalları ve haftalık paylaşım sayını yaz.", ornek: "Ana kanal Instagram, haftada üç paylaşım · Facebook'a kısaltarak", etiket: "Sosyal Planlayıcı", olcu: "Ana kanal(lar) + türev kanallar · haftada kaç paylaşım", tur: kisa_metin, zorunlu: true, kaynak_alanlar: [R4.ana_kanallar, R4.turev_kanallar]}
    - {anahtar: kapi, soru: "İnsanlar senin listene hangi ücretsiz değerle ve hangi formla girecek?", aciklama: "İlk ücretsiz değerinin adını, formda isteyeceğin en az bilgiyi ve iki ayrı onayı (teslim için, ticari ileti için) yaz.", ornek: "Bayram sofrasından sonra suçlamadan dönmenin beş yolu rehberi · ad ve e-posta · iki ayrı onay kutusu", etiket: "Kapı (sayfa + form)", olcu: "İlk ücretsiz değerin adı · formda istenecek bilgiler (en az) · iki onay: teslim için / ticari ileti için", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R4.ilk_ucretsiz_deger]}
    - {anahtar: etiketler, soru: "Gelen kişiyi hangi bilgilere göre işaretleyeceksin?", aciklama: "Kişinin hangi değeri istediğini ve seni nereden bulduğunu gösterecek işaretleri yaz.", ornek: "Rehberi istedi · Instagram'dan geldi", etiket: "Etiketler", olcu: "Hangi değeri istedi · nereden geldi", tur: kisa_metin, zorunlu: true}
    - {anahtar: yol_otomasyon, soru: "Rehberi alan kişiye sonraki günlerde hangi mesajlar gidecek?", aciklama: "Teslim mailini, en sık sorulan sorulardan seçtiğin üç beş mailin konusunu ve sessiz kalana kaçıncı gün dönüleceğini yaz.", ornek: "Rehber teslimi · 'ara vermek normal' · 'kendi sofrandan başlamak' · 30. gün kısa bir dönüş mesajı", etiket: "Yol (otomasyon)", olcu: "Teslim maili · sonraki 3–5 mailin konusu (en sık 10 sorudan) · sessiz kalana dönüş günü", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R4.en_sik_10_soru]}
    - {anahtar: ev, soru: "İnsanlar en sonunda nerede seninle kalacak?", aciklama: "E-posta listesi, topluluk ya da randevu: ilginin evini ve eve davetin hangi mailde yapılacağını yaz.", ornek: "E-posta listem · üçüncü mailde ücretsiz tanışma görüşmesine davet", etiket: "Ev", olcu: "E-posta listesi / topluluk / randevu · kapıdan eve davet hangi mailde", tur: kisa_metin, zorunlu: true, kaynak_alanlar: [R4.ilginin_evi]}
    - {anahtar: fiziksel_dunya, soru: "Fiziksel dünyada nereye bir QR kod koyabilirsin?", aciklama: "Masan, kartvizitin ya da broşürün gibi bir nokta yaz; yoksa boş bırak.", ornek: "Muayenehanedeki masa kartı", etiket: "Fiziksel dünya (isteğe bağlı)", olcu: "QR koyacağın bir nokta (masa, ayna, broşür)", tur: kisa_metin, zorunlu: false}
  tek_olcut: {soru: "Bir ay içinde rehberini alanlardan kaçı listene ya da topluluğuna ulaştı?", aciklama: "Bir ay sonra say ve yaz; bu sayıyı W aşamasında ölçeceksin.", etiket: "Tek ölçüt", olcu: "Bir ay içinde kapıdan giren kişilerin kaçı eve (listeye/topluluğa) ulaştı? (Sayı W'de ölçülür.)", tur: sayi, sonradan_doldurulur: true}
  bagimli: [R4]
  ghl: [{alan_adi: "GAI - Harita OV4", tur: buyuk_metin}]
  tam_yuvasi: "TP.3: Sosyal Planlayıcı, Siteler/Formlar, Etiketler, Otomasyon, Topluluklar"
  sohbet_kipi: cikar

- anahtar: OV5
  baslik: "Süreç Yerleşimim"
  ders: OV.5
  script: scriptler/o-vitrin/OV.5-yolculuk.md
  modul: Kurulum Haritam
  satir: Yolculuk
  tekrar: tek_sefer
  alanlar:
    - {anahtar: surec_8_asama, soru: "Müşteri yolculuğunun sekiz aşaması senin işinde hangi adlarla anılıyor?", aciklama: "İlk ilgiden müşteri olmaya kadar sekiz aşamayı kendi işindeki adlarıyla sırala.", ornek: "İlk mesaj · ilk cevap · tanışma · ücretsiz görüşme ayarlandı · görüşme · teklif · karar bekleniyor · danışan oldu", etiket: "Süreç (8 aşama)", olcu: "Her aşamanın benim işimdeki adı", tur: liste, adet: 8, zorunlu: true, kaynak_alanlar: [R5.asamalar]}
    - {anahtar: asamaya_giris, soru: "Kişi her aşamaya nasıl geçiyor?", aciklama: "Her aşama için geçişin elle mi otomatik mi olduğunu ve neyle tetiklendiğini (form, randevu, ödeme, süre) yaz.", ornek: "Form gelince ilk ilgi otomatik · görüşme randevuyla otomatik · teklif sonrası kartı elle taşıyorum", etiket: "Aşamaya giriş", olcu: "Her aşama için: elle mi, otomatik mi, neyle (form, randevu, ödeme, süre)", tur: uzun_metin, zorunlu: true}
    - {anahtar: kaybedildi_nedenleri, soru: "Müşteri adayını kaybettiğinde hangi nedenleri not edeceksin?", aciklama: "Uygun değil, şimdi değil, gelmedi ve sessiz kaldı nedenlerini koru; işine özel bir neden varsa ekle.", ornek: "Uygun değil · şimdi değil · gelmedi · sessiz kaldı · başka bir uzmanla başladı", etiket: "Kaybedildi nedenleri", olcu: "Uygun değil · şimdi değil · gelmedi · sessiz kaldı (+ bana özel varsa)", tur: liste, zorunlu: true}
    - {anahtar: kisi_karti, soru: "Her kişinin kartında hangi bilgiler olacak?", aciklama: "Nereden geldiğini, neyle ilgilendiğini ve ön görüşme sorularının cevaplarını yaz; sağlık bilgisi kart alanına girmez.", ornek: "Kaynak: Instagram · ilgi: kendi sofran programı · ön görüşme: hedefi, neyi denedi, ne zaman başlamak istiyor", etiket: "Kişi kartı", olcu: "Kaynak etiketi · ilgi/profil etiketi · ön görüşme cevapları (alanlar)", tur: kisa_metin, zorunlu: true, kaynak_alanlar: [R5.on_gorusme_sorulari]}
    - {anahtar: takvim, soru: "Ön görüşme randevun nasıl olacak?", aciklama: "Randevu türünü, süresini, randevu alırken soracağın soruları ve onay ile hatırlatma mesajlarını yaz.", ornek: "Ücretsiz tanışma görüşmesi · 20 dakika · iki soru · onay ve bir gün önce hatırlatma", etiket: "Takvim", olcu: "Randevu türü · süresi · ön görüşme soruları · onay + hatırlatma", tur: kisa_metin, zorunlu: true}
    - {anahtar: ilk_akis, soru: "En çok kaybettiğin aşamaya hangi akışı kuracaksın?", aciklama: "Aşamayı, kaç mesaj gideceğini, aralıklarını ve akışın ne zaman duracağını yaz.", ornek: "Karar bekleniyor · üç mesaj, ikişer gün arayla · ödeme gelince ya da cevap verince durur", etiket: "İlk akış", olcu: "En çok kaybettiğim aşama · oraya kuracağım tek akış (kaç mesaj, hangi aralıkla, ne zaman durur)", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R5.en_cok_kaybedilen]}
  tek_olcut: {soru: "İlk akışı kurduğun aşamada bir ay sonra kaybolan kişi sayısı azaldı mı?", aciklama: "Bir ay sonra o aşamada kaybolanları say ve önceki ayla kıyasla; bunu W aşamasında ölçeceksin.", etiket: "Tek ölçüt", olcu: "İlk akışı kurduğun aşamada bir ay sonra kaybolan kişi sayısı azaldı mı? (W'de ölçülür.)", tur: kisa_metin, sonradan_doldurulur: true}
  bagimli: [R5]
  ghl: [{alan_adi: "GAI - Harita OV5", tur: buyuk_metin}]
  tam_yuvasi: "TP.4: Fırsatlar › Süreç (8 aşama), özel alanlar, Takvimler, Otomasyon"
  sohbet_kipi: cikar

- anahtar: OV6
  baslik: "İletişim Yerleşimim"
  ders: OV.6
  script: scriptler/o-vitrin/OV.6-erisim-iletisim.md
  modul: Kurulum Haritam
  satir: Erişim ve İletişim
  tekrar: tek_sefer
  alanlar:
    - {anahtar: tek_gelen_kutusu, soru: "Hangi mesaj kanalların tek bir kutuda toplanacak?", aciklama: "Müşterilerinin sana yazdığı kanalları sırala: WhatsApp, Instagram, Facebook, e-posta, site sohbeti.", ornek: "WhatsApp · Instagram · e-posta", etiket: "Tek gelen kutusu", olcu: "Bağlanacak kanallar (WhatsApp, Instagram, Facebook, e-posta, site sohbeti)", tur: liste, zorunlu: true, kaynak_alanlar: [R6.acik_kanallar]}
    - {anahtar: hazir_metinler, soru: "İlk karşılama mesajın ve en sık kullandığın üç cevap ne?", aciklama: "Mesai içi ve mesai dışı karşılama mesajını ve sık yazdığın üç cevabı kendi sesinle yaz.", ornek: "Mesai dışı: Mesajın bana ulaştı, sabah dokuzda dönüyorum; bu arada rehbere göz atabilirsin.", etiket: "Hazır Metinler", olcu: "İlk karşılama mesajım (mesai içi / dışı) · sık kullandığım 3 cevap", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R6.ilk_karsilama]}
    - {anahtar: bilgi_bankasi, soru: "Asistanın bilgi bankasına hangi metinlerin girecek?", aciklama: "Kimlik Çekirdeğin, teklifin ve itirazların, en sık on soru ve erişim kartın buraya toplanır; sen yalnız seçip onaylarsın.", etiket: "Bilgi Bankası", olcu: "Kimlik Çekirdeği · teklif + 5 itiraz · en sık 10 soru · erişim kartı", tur: kisa_metin, zorunlu: true, kaynak_alanlar: [R2, R3.itirazlar, R4.en_sik_10_soru, R6], not: "İçerik R'den toplanır; öğrenci yalnız seçer/onaylar."}
    - {anahtar: asistan_kurallari, soru: "Asistanın neleri cevaplayacak, neleri asla cevaplamayacak?", aciklama: "Cevaplayacağı beş soruyu, asla cevaplamayacağı üç durumu ve o anda kullanacağı \"size dönüyoruz\" cümlesini yaz; başlangıçta öneri modunda çalışır.", ornek: "Asla: tıbbi tanı, ilaç sorusu, şikâyet · \"Bunu bizzat konuşmamız daha doğru, en kısa sürede size dönüyorum.\"", etiket: "Asistan kuralları", olcu: "Cevaplayacağı 5 soru · asla cevaplamayacağı 3 durum · \"size dönüyoruz\" cümlesi · başlangıç modu: öneri", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R6.yz_sorulari, R6.devir_anlari, R9.susma_ani]}
