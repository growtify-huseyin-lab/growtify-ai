# Çalışma Dosyam · bölüm tanımları · OV (Kurulum Haritam, 9 satır)
# Kaynak: scriptler/o-vitrin/OV.0, OV.2 … OV.9 teslim tabloları (2026-10-23). OV.1 yok.
# GHL (Course kararı 2026-10-23, MIMARI §3): satır başına bir uzun metin alanı "GAI - Harita OVn"; içerik etiketli satırlar ("Yuva: …");
# tümü dolunca etiket gai_harita_tamam. Tam'ı besleyen kısa değerler için yeni alan açılmaz, R alanlarına referans verilir.
# Ortak kural: Temel'de hesap yok; bu satırlar plan, kurulum değil. Alanlar "buraya ne koyacağım" sorusunu cevaplar.

- anahtar: OV0
  baslik: "Kurulum Haritam açılır"
  ders: OV.0
  script: scriptler/o-vitrin/OV.0-vitrin-girisi.md
  modul: Kurulum Haritam
  tekrar: tek_sefer
  alanlar:
    - {anahtar: isim_adi, etiket: "İşimin adı", tur: kisa_metin, zorunlu: true}
    - {anahtar: dagilim_3_yer, etiket: "Müşterilerim bugün hangi 3 yerde dağılmış", olcu: "ör. WhatsApp · defter · tablo", tur: liste, adet: 3, zorunlu: true}
  tek_olcut: null
  bagimli: []
  ghl: [{alan_adi: "GAI - Harita OV0", tur: buyuk_metin}]
  tam_yuvasi: "Tam ilk görüşmesinin gündemi (OV.9 harita özeti)"
  sohbet_kipi: yok
  not: "Scriptte tek ölçüt yok. 'Sonraki satırlar her OV dersinde eklenir' yalnız açıklama."

- anahtar: OV2
  baslik: "Yuva Haritam"
  ders: OV.2
  script: scriptler/o-vitrin/OV.2-kimsin.md
  modul: Kurulum Haritam
  satir: Kimsin
  tekrar: tek_sefer
  alanlar:
    - {anahtar: isletme_profili, etiket: "İşletme Profili", olcu: "Ad, iletişim, adres (varsa), logo", tur: kisa_metin, zorunlu: true}
    - {anahtar: tasarim_kiti, etiket: "Marka Panoları › Tasarım Kiti", olcu: "Logo, 2–3 renk, yazı tipi (yoksa \"henüz yok\")", tur: kisa_metin, zorunlu: true}
    - {anahtar: ozel_degerler, etiket: "Özel Değerler", olcu: "Tek cümle (≤20 kelime) · kime (1 satır) · kısa tanıtım (3–4 cümle)", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R2.tek_cumle, R2.kime_kime_degil], not: "tek cümle ve kime R2'den referans; yalnız kısa tanıtım yeni"}
    - {anahtar: marka_sesi, etiket: "Marka Panoları › Marka Sesi", olcu: "Ses notu (5 madde) + duruş (1–2 cümle) + kaçındığım kelimeler", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R2.ses, R2.durus]}
    - {anahtar: bilgi_bankasi, etiket: "Bilgi Bankası", olcu: "Neden · kime / kime değil · dönüşüm (önce → sonra) · nasıl · duruş · en sık sorulan 5 soru ve cevabı", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R2]}
    - {anahtar: disarida_elle, etiket: "Dışarıda, elle", olcu: "Instagram / LinkedIn biyografisi · Google İşletme açıklaması · WhatsApp Business açıklaması", tur: uzun_metin, zorunlu: false}
  tek_olcut: null
  bagimli: [R2]
  ghl: [{alan_adi: "GAI - Harita OV2", tur: buyuk_metin}]
  tam_yuvasi: "TP.1: İşletme Profili, Tasarım Kiti, Özel Değerler, Marka Sesi, Bilgi Bankası"
  sohbet_kipi: cikar
  not: "İsteğe bağlı 'yüz denetimi' ders altında; alan değil. Scriptte tek ölçüt yok. Bilgi Bankası'ndaki '5 soru' R4'teki 10 sorunun ilk 5'i mi, ayrı mı: belirsiz."

- anahtar: OV3
  baslik: "Teklif Yerleşimim"
  ders: OV.3
  script: scriptler/o-vitrin/OV.3-teklif.md
  modul: Kurulum Haritam
  satir: Teklif
  tekrar: tek_sefer
  alanlar:
    - {anahtar: teklif, etiket: "Teklif", olcu: "Ad · tek cümlelik söz (açıklama) · neler dahil (liste)", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R3.soz]}
    - {anahtar: urun, etiket: "Ürün", olcu: "Ödeme kaleminin adı · biçim (tek seferlik / üyelik / seans) · fiyat: R.7'de", tur: kisa_metin, zorunlu: true}
    - {anahtar: sayfa, etiket: "Sayfa", olcu: "9 başlık → 9 bölüm · kanıt yoksa bölüm yok · 5 itiraz → sık sorulanlar", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R3.sayfa_iskeleti, R3.itirazlar]}
    - {anahtar: bilgi_bankasi, etiket: "Bilgi Bankası", olcu: "Aynı 5 soru-cevap", tur: kisa_metin, zorunlu: true, kaynak_alanlar: [R3.itirazlar]}
    - {anahtar: sartlar, etiket: "Şartlar", olcu: "Söz sınırı (1–2 cümle) · ön bilgilendirme + mesafeli satış gerekli mi · imzalı sözleşme gerekli mi (birebir/uzun hizmet)", tur: uzun_metin, zorunlu: true}
  tek_olcut: {etiket: "Tek ölçüt", olcu: "Sayfanın ilk ekranını gösterdiğin üç kişiden kaçı \"bu kimin için ve ne veriyor\" sorusunu doğru cevapladı? (R.3 ile aynı ölçüt, bu kez sayfada.)", tur: sayi, sonradan_doldurulur: true}
  bagimli: [R3]
  ghl: [{alan_adi: "GAI - Harita OV3", tur: buyuk_metin}]
  tam_yuvasi: "TP.2: Teklifler, Ürünler, satış hunisi sayfası, Belgeler ve Sözleşmeler, Bilgi Bankası"
  sohbet_kipi: cikar

- anahtar: OV4
  baslik: "Ekosistem Yerleşimim"
  ders: OV.4
  script: scriptler/o-vitrin/OV.4-ekosistem.md
  modul: Kurulum Haritam
  satir: Ekosistem
  tekrar: tek_sefer
  alanlar:
    - {anahtar: sosyal_planlayici, etiket: "Sosyal Planlayıcı", olcu: "Ana kanal(lar) + türev kanallar · haftada kaç paylaşım", tur: kisa_metin, zorunlu: true, kaynak_alanlar: [R4.ana_kanallar, R4.turev_kanallar]}
    - {anahtar: kapi, etiket: "Kapı (sayfa + form)", olcu: "İlk ücretsiz değerin adı · formda istenecek bilgiler (en az) · iki onay: teslim için / ticari ileti için", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R4.ilk_ucretsiz_deger]}
    - {anahtar: etiketler, etiket: "Etiketler", olcu: "Hangi değeri istedi · nereden geldi", tur: kisa_metin, zorunlu: true}
    - {anahtar: yol_otomasyon, etiket: "Yol (otomasyon)", olcu: "Teslim maili · sonraki 3–5 mailin konusu (en sık 10 sorudan) · sessiz kalana dönüş günü", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R4.en_sik_10_soru]}
    - {anahtar: ev, etiket: "Ev", olcu: "E-posta listesi / topluluk / randevu · kapıdan eve davet hangi mailde", tur: kisa_metin, zorunlu: true, kaynak_alanlar: [R4.ilginin_evi]}
    - {anahtar: fiziksel_dunya, etiket: "Fiziksel dünya (isteğe bağlı)", olcu: "QR koyacağın bir nokta (masa, ayna, broşür)", tur: kisa_metin, zorunlu: false}
  tek_olcut: {etiket: "Tek ölçüt", olcu: "Bir ay içinde kapıdan giren kişilerin kaçı eve (listeye/topluluğa) ulaştı? (Sayı W'de ölçülür.)", tur: sayi, sonradan_doldurulur: true}
  bagimli: [R4]
  ghl: [{alan_adi: "GAI - Harita OV4", tur: buyuk_metin}]
  tam_yuvasi: "TP.3: Sosyal Planlayıcı, Siteler/Formlar, Etiketler, Otomasyon, Topluluklar"
  sohbet_kipi: cikar

- anahtar: OV5
  baslik: "Süreç Yerleşimim"
  ders: OV.5
  script: scriptler/o-vitrin/OV.5-yolculuk.md
  modul: Kurulum Haritam
  satir: Yolculuk
  tekrar: tek_sefer
  alanlar:
    - {anahtar: surec_8_asama, etiket: "Süreç (8 aşama)", olcu: "Her aşamanın benim işimdeki adı", tur: liste, adet: 8, zorunlu: true, kaynak_alanlar: [R5.asamalar]}
    - {anahtar: asamaya_giris, etiket: "Aşamaya giriş", olcu: "Her aşama için: elle mi, otomatik mi, neyle (form, randevu, ödeme, süre)", tur: uzun_metin, zorunlu: true}
    - {anahtar: kaybedildi_nedenleri, etiket: "Kaybedildi nedenleri", olcu: "Uygun değil · şimdi değil · gelmedi · sessiz kaldı (+ bana özel varsa)", tur: liste, zorunlu: true}
    - {anahtar: kisi_karti, etiket: "Kişi kartı", olcu: "Kaynak etiketi · ilgi/profil etiketi · ön görüşme cevapları (alanlar)", tur: kisa_metin, zorunlu: true, kaynak_alanlar: [R5.on_gorusme_sorulari]}
    - {anahtar: takvim, etiket: "Takvim", olcu: "Randevu türü · süresi · ön görüşme soruları · onay + hatırlatma", tur: kisa_metin, zorunlu: true}
    - {anahtar: ilk_akis, etiket: "İlk akış", olcu: "En çok kaybettiğim aşama · oraya kuracağım tek akış (kaç mesaj, hangi aralıkla, ne zaman durur)", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R5.en_cok_kaybedilen]}
  tek_olcut: {etiket: "Tek ölçüt", olcu: "İlk akışı kurduğun aşamada bir ay sonra kaybolan kişi sayısı azaldı mı? (W'de ölçülür.)", tur: kisa_metin, sonradan_doldurulur: true}
  bagimli: [R5]
  ghl: [{alan_adi: "GAI - Harita OV5", tur: buyuk_metin}]
  tam_yuvasi: "TP.4: Fırsatlar › Süreç (8 aşama), özel alanlar, Takvimler, Otomasyon"
  sohbet_kipi: cikar

- anahtar: OV6
  baslik: "İletişim Yerleşimim"
  ders: OV.6
  script: scriptler/o-vitrin/OV.6-erisim-iletisim.md
  modul: Kurulum Haritam
  satir: Erişim ve İletişim
  tekrar: tek_sefer
  alanlar:
    - {anahtar: tek_gelen_kutusu, etiket: "Tek gelen kutusu", olcu: "Bağlanacak kanallar (WhatsApp, Instagram, Facebook, e-posta, site sohbeti)", tur: liste, zorunlu: true, kaynak_alanlar: [R6.acik_kanallar]}
    - {anahtar: hazir_metinler, etiket: "Hazır Metinler", olcu: "İlk karşılama mesajım (mesai içi / dışı) · sık kullandığım 3 cevap", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R6.ilk_karsilama]}
    - {anahtar: bilgi_bankasi, etiket: "Bilgi Bankası", olcu: "Kimlik Çekirdeği · teklif + 5 itiraz · en sık 10 soru · erişim kartı", tur: kisa_metin, zorunlu: true, kaynak_alanlar: [R2, R3.itirazlar, R4.en_sik_10_soru, R6], not: "İçerik R'den toplanır; öğrenci yalnız seçer/onaylar."}
    - {anahtar: asistan_kurallari, etiket: "Asistan kuralları", olcu: "Cevaplayacağı 5 soru · asla cevaplamayacağı 3 durum · \"size dönüyoruz\" cümlesi · başlangıç modu: öneri", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R6.yz_sorulari, R6.devir_anlari, R9.susma_ani]}
    - {anahtar: kademeler, etiket: "Kademeler", olcu: "Kademe → neye erişir → ben hangi anda devredeyim (kısa hali)", tur: kisa_metin, zorunlu: true, kaynak_alanlar: [R6.erisim_kademeleri]}
  tek_olcut: {etiket: "Tek ölçüt", olcu: "İlk mesaja ilk cevap süresi ve devredilen sohbetlere dönüş süresi (W'de ölçülür).", tur: kisa_metin, sonradan_doldurulur: true}
  bagimli: [R6, R9]
  ghl: [{alan_adi: "GAI - Harita OV6", tur: buyuk_metin}]
  tam_yuvasi: "TP.5: Sohbetler, Hazır Metinler, Sohbet Yapay Zekası + Bilgi Bankası, Üyelikler (+ TP.7.4 Topluluk)"
  sohbet_kipi: cikar

- anahtar: OV7
  baslik: "Ödeme Yerleşimim"
  ders: OV.7
  script: scriptler/o-vitrin/OV.7-fiyat-odeme.md
  modul: Kurulum Haritam
  satir: Fiyat ve Ödeme
  tekrar: tek_sefer
  alanlar:
    - {anahtar: urunler, etiket: "Ürünler", olcu: "Her kademe bir ürün: ad · fiyat (TL) · tek seferlik / abonelik", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R7.kademeler]}
    - {anahtar: odeme_yolu, etiket: "Ödeme yolu", olcu: "Teklif sayfasından mı, görüşme sonrası bağlantıyla mı", tur: secim, secenekler: ["teklif sayfası", "görüşme sonrası bağlantı"], coklu: true, zorunlu: true}
    - {anahtar: abonelik, etiket: "Abonelik", olcu: "Hangi ürün · hangi gün · ilk dönem ücretsiz mi", tur: kisa_metin, zorunlu: false}
    - {anahtar: bolunmus_odeme, etiket: "Bölünmüş ödeme / taksit", olcu: "Hangi kademe · kaç parça · bedeli kimde · (kart taksiti ödeme kuruluşunda)", tur: kisa_metin, zorunlu: false}
    - {anahtar: indirim_kodu, etiket: "İndirim kodu", olcu: "Varsa: kime, ne kadar süre, gerçek süre mi", tur: kisa_metin, zorunlu: false}
    - {anahtar: odeme_sonrasi, etiket: "Ödeme sonrası", olcu: "Ödeme gelince ne açılır (OV.8'de ayrıntı)", tur: kisa_metin, zorunlu: true}
    - {anahtar: havale, etiket: "Havale", olcu: "Kim takip eder, erişim nasıl verilir", tur: kisa_metin, zorunlu: false}
    - {anahtar: hatirlatma_tonu, etiket: "Hatırlatma tonu", olcu: "Tek cümle", tur: kisa_metin, zorunlu: true}
    - {anahtar: resmi_fatura, etiket: "Resmi fatura", olcu: "Muhasebe programı / mali müşavir / \"henüz yok\"", tur: secim, secenekler: ["muhasebe programı", "mali müşavir", "henüz yok"], zorunlu: true}
  tek_olcut: {etiket: "Tek ölçüt", olcu: "Ödeme bağlantısı gönderilenlerin kaçı ödedi; kaçına hatırlatma gerekti (W'de ölçülür).", tur: kisa_metin, sonradan_doldurulur: true}
  bagimli: [R7]
  ghl: [{alan_adi: "GAI - Harita OV7", tur: buyuk_metin}]
  tam_yuvasi: "TP.6: Ürünler, Ödeme Bağlantıları, Abonelikler, Kuponlar"
  sohbet_kipi: cikar

- anahtar: OV8
  baslik: "Karşılama Yerleşimim"
  ders: OV.8
  script: scriptler/o-vitrin/OV.8-agirlama.md
  modul: Kurulum Haritam
  satir: Ağırlama
  tekrar: tek_sefer
  alanlar:
    - {anahtar: odeme_ani_akisi, etiket: "Ödeme anı akışı", olcu: "Tetikleyici (ödeme / sözleşme) · etiket · süreçte müşteri aşaması · sorumlu", tur: kisa_metin, zorunlu: true}
    - {anahtar: karsilama, etiket: "Karşılama", olcu: "Hoş geldin mesajı/dokümanı/videosu · içinde: süreç, beklenti, ilk adım", tur: uzun_metin, zorunlu: true, kaynak_alanlar: [R8.ilk_saatler]}
    - {anahtar: erisim, etiket: "Erişim", olcu: "Ödeme anında ne açılır · süre sonunda ne olur", tur: kisa_metin, zorunlu: true}
    - {anahtar: destek_kaynaklari, etiket: "Destek kaynakları", olcu: "Topluluk / e-posta / asistan · cevap süresi", tur: kisa_metin, zorunlu: true, kaynak_alanlar: [R8.destek_sinirlari]}
    - {anahtar: proaktif_yoklama, etiket: "Proaktif yoklama", olcu: "Kaçıncı gün, hangi soruyla", tur: kisa_metin, zorunlu: true, kaynak_alanlar: [R8.proaktif_yoklama]}
    - {anahtar: ugurlama, etiket: "Uğurlama", olcu: "Süreç biterken giden mesaj · kapıyı açık bırakan teklif ya da davet", tur: kisa_metin, zorunlu: true, kaynak_alanlar: [R8.ugurlama]}
    - {anahtar: memnuniyet_yorum, etiket: "Memnuniyet ve yorum", olcu: "Soru zamanı · yorum isteği zamanı · herkese aynı", tur: kisa_metin, zorunlu: true, kaynak_alanlar: [R8.memnuniyet_yorum]}
  tek_olcut: {etiket: "Tek ölçüt", olcu: "Yeni müşterilerin kaçı ilk kazanıma ulaştı; kaçı ilk hafta sessiz kaldı (W'de ölçülür).", tur: kisa_metin, sonradan_doldurulur: true}
  bagimli: [R8]
  ghl: [{alan_adi: "GAI - Harita OV8", tur: buyuk_metin}]
  tam_yuvasi: "TP.7: Otomasyon (ödeme anı), Üyelikler, Formlar, İtibar"
  sohbet_kipi: cikar

- anahtar: OV9
  baslik: "Ölçüm satırı + harita tamamlanır"
  ders: OV.9
  script: scriptler/o-vitrin/OV.9-olcum.md
  modul: Kurulum Haritam
  satir: Ölçüm
  tekrar: tek_sefer
  alanlar:
    - {anahtar: izlenecek_3_sayi, etiket: "İzleyeceğim 3 sayı", olcu: "R'deki tek ölçütlerimden en önemli üçü (ör. haftalık yeni ilgi · görüşmeye gelme · ödeme)", tur: liste, adet: 3, zorunlu: true, secenekler_kaynagi: "R2–R9 tek_olcut"}
    - {anahtar: kaynak_etiketleri, etiket: "Kaynak etiketlerim", olcu: "Instagram / Google / tavsiye / QR / rehber…", tur: liste, zorunlu: true}
    - {anahtar: pazartesi_sorusu, etiket: "Pazartesi sorum", olcu: "Her pazartesi panoya baktığımda cevabını aradığım tek soru", tur: kisa_metin, zorunlu: true}
    - {anahtar: harita_ozeti, etiket: "Harita özeti", olcu: "OV.0 + OV.2–OV.9: işimin kurulum planı (Tam'a girişte ilk görüşmenin gündemi)", tur: uzun_metin, zorunlu: false, not: "öğrenci yazmaz; araç OV0–OV9'dan derler, öğrenci onaylar"}
  tek_olcut: null
  bagimli: [OV0, OV2, OV3, OV4, OV5, OV6, OV7, OV8]
  ghl:
    - {alan_adi: "GAI - Harita OV9", tur: buyuk_metin}
    - {etiket: gai_harita_tamam, kosul: "OV0 ve OV2–OV9 onaylı"}
  tam_yuvasi: "TP.8 Ölçüm + TP.9 Uçtan uca; Tam ilk görüşmesinin gündemi"
  sohbet_kipi: cikar
  not: "Scriptte ayrı 'Tek ölçüt' satırı yok."
